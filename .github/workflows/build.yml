name: Build Doraking mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1
      - name: Build
        run: gradle build --no-daemon
      - name: Upload jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: doraking-jar
          path: build/libs/doraking-*.jar
      - name: Publish release with the jar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build-${{ github.run_number }}
          name: Doraking 1.0.0 (build ${{ github.run_number }})
          files: build/libs/doraking-1.0.0.jar
