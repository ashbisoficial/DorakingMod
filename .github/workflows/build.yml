name: Build Doraking mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1
      - name: Read version
        id: ver
        run: echo "v=$(grep -oP "^version = '\K[^']+" build.gradle)" >> "$GITHUB_OUTPUT"
      - name: Build
        run: gradle build --no-daemon
      - name: Upload jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: doraking-${{ steps.ver.outputs.v }}
          path: build/libs/doraking-*.jar
      - name: Publish release with the jar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Doraking ${{ steps.ver.outputs.v }}
          files: build/libs/doraking-${{ steps.ver.outputs.v }}.jar
