plugins {
    id 'eclipse'
    id 'idea'
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.2.0'
group = 'cl.doraking.mod'
base { archivesName = 'doraking' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client { workingDirectory project.file('run'); property 'forge.logging.console.level', 'debug'
            mods { doraking { source sourceSets.main } } }
        server { workingDirectory project.file('run'); args '--nogui'
            mods { doraking { source sourceSets.main } } }
    }
}

repositories { }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
}

tasks.named('jar', Jar).configure {
    manifest.attributes(['Implementation-Title': 'doraking', 'Implementation-Version': project.version])
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand 'file': ['jarVersion': project.version] }
}
